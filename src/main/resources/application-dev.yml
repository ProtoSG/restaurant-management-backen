server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/ddbb_restaurant_management_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.restaurant_management: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

scalar:
  enabled: true
  path: docs
  url: http://localhost:8080/api/v3/api-docs

frontend:
  url: ${FRONTEND_URL:http://localhost:5173}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
  # Optional for now (empty default) — Whisper is a pending decision, not committed yet. Only
  # POST /voice-order-test/audio needs this; the app must still start without it. Switch back to
  # fail-fast (${OPENAI_API_KEY}, no default) once Whisper is actually adopted.
  openai:
    api-key: ${OPENAI_API_KEY:}

cookie:
  secure: false
  same-site: Lax
