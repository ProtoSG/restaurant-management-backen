server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: WARN
    com.restaurant_management: INFO
    org.springframework.web: WARN

scalar:
  enabled: ${SCALAR_ENABLED:false}
  path: docs
  url: ${API_DOCS_URL:http://localhost:8080/api/v3/api-docs}

frontend:
  url: ${FRONTEND_URL}

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY}
  # Optional (empty default) — Whisper is a pending decision, not adopted yet (see
  # application-dev.yml). Only POST /voice-order-test/audio needs this; the app must
  # still start without it. Switch back to fail-fast (${OPENAI_API_KEY}, no default)
  # once Whisper is actually adopted in prod.
  openai:
    api-key: ${OPENAI_API_KEY:}
  # MinIO — see application-dev.yml for the general shape. No dev-friendly defaults here: empty
  # means "not configured, image upload unavailable", never a fallback that would silently
  # point at some real bucket. Set MINIO_ENDPOINT (a real reverse-proxied domain, not the
  # internal Docker network address, since it's used to build public image URLs too, unless
  # MINIO_PUBLIC_BASE_URL is set separately for that) once MinIO is actually stood up.
  minio:
    endpoint: ${MINIO_ENDPOINT:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:product-images}
    public-base-url: ${MINIO_PUBLIC_BASE_URL:}

cookie:
  secure: true
  same-site: None
